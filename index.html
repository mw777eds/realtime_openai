<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @import "./src/style.css";
    </style>
    <title>JSDev</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="app-title">Empowered Agents</div>
        <div class="app-controls">
          <label><input type="checkbox" id="toggle-voice" checked /> Voice</label>
          <label><input type="checkbox" id="toggle-text" /> Text</label>
          <label><input type="checkbox" id="toggle-toasts" checked /> Debug Toasts</label>
          <button id="save-layout-btn" class="save-btn" title="Save current grid layout">Save Layout</button>
        </div>
      </header>
      <div class="app-main">
        <aside class="sidebar">
          <div class="sidebar-header">
            <div class="sidebar-title">Conversations</div>
            <div class="sidebar-actions">
              <button id="dock-convos-btn" class="icon-btn header-icon" title="Undock to grid" aria-pressed="false">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <path d="M12 3v3M9 6h6M6 9a6 6 0 0012 0M5 12c0 3.866 3.134 7 7 7s7-3.134 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
              <button id="new-conversation-btn" class="icon-btn header-icon new-convo-btn" title="New conversation">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                  <path d="M4 4h10a2 2 0 012 2v3M4 20h10a2 2 0 002-2v-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M14.5 5.5l4 4M7 17l-1.5 3.5L9 19l8.5-8.5-4-4L7 17z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="sidebar-search">
            <input type="search" id="conversation-search" placeholder="Search conversations..." />
          </div>
          <div id="conversation-list" class="conversation-list"></div>
        </aside>
        <section class="workspace">
          <div class="grid-stack" id="appGrid"></div>
        </section>
      </div>
    </div>
    <script type="module">
      import "./src/index.js";
    </script>
  </body>
</html>
