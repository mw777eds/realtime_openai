<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @import "./src/style.css";
    </style>
    <title>JSDev</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="app-title">Empowered Agents</div>
        <div class="app-controls">
          <div class="menu">
            <button id="menu-toggle" class="menu-toggle" aria-expanded="false" aria-haspopup="true" title="Menu">
              <span class="bar"></span>
              <span class="bar"></span>
              <span class="bar"></span>
            </button>
            <div id="menu-panel" class="menu-panel" hidden>
              <button id="btn-voice" class="menu-item toggle active" aria-pressed="true">Voice</button>
              <button id="btn-text" class="menu-item toggle" aria-pressed="false">Text</button>
              <button id="btn-toasts" class="menu-item toggle active" aria-pressed="true">Debug Toasts</button>
              <hr />
              <button id="btn-toggle-float" class="menu-item">Float On</button>
              <button id="btn-save-layout" class="menu-item">Save Layout</button>
              <button id="btn-restore-layout" class="menu-item">Restore Default Layout</button>
            </div>
          </div>
        </div>
      </header>
      <div class="app-main">
        <aside class="sidebar">
          <div class="sidebar-header">
            <div class="sidebar-title">Conversations</div>
            <div class="sidebar-actions">
              <button id="dock-convos-btn" class="icon-btn header-icon" title="Undock Conversations to grid (click again to dock)" aria-pressed="false"></button>
              <button id="new-conversation-btn" class="icon-btn header-icon new-convo-btn" title="Start a new conversation"></button>
            </div>
          </div>
          <div class="sidebar-search">
            <input type="search" id="conversation-search" placeholder="Search conversations..." />
          </div>
          <div id="conversation-list" class="conversation-list"></div>
        </aside>
        <section class="workspace">
          <div class="grid-stack" id="appGrid"></div>
        </section>
      </div>
    </div>
    <script type="module">
      import "./src/index.js";
    </script>
  </body>
</html>
